<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard — Hunar Hub</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <navbar>
        <a href="/" class="logo">Hunar Hub (Admin Panel)</a>
        <ul class="nav-links">
            <li><a href="#" onclick="logout()">Logout</a></li>
        </ul>
    </navbar>

    <div class="container">
        <h2>Platform Statistics & Management</h2>
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; margin: 1.5rem 0 3rem 0;">
            <div class="form-card" style="margin: 0; text-align: center;">
                <h3 style="color: #64748b; font-size: 1rem;">Total Customers</h3>
                <p id="customerCount" style="font-size: 2.5rem; font-weight: bold; color: #0d9488; margin-top: 0.5rem;">
                    0</p>
            </div>
            <div class="form-card" style="margin: 0; text-align: center;">
                <h3 style="color: #64748b; font-size: 1rem;">Skilled Workers</h3>
                <p id="workerCount" style="font-size: 2.5rem; font-weight: bold; color: #0d9488; margin-top: 0.5rem;">0
                </p>
            </div>
            <div class="form-card" style="margin: 0; text-align: center;">
                <h3 style="color: #64748b; font-size: 1rem;">Total Service Bookings</h3>
                <p id="bookingCount" style="font-size: 2.5rem; font-weight: bold; color: #0d9488; margin-top: 0.5rem;">0
                </p>
            </div>
        </div>

        <!-- Users & Workers Management Section -->
        <h2 style="margin-top: 2rem;">Manage Users & Workers</h2>
        <div id="allUsers" style="margin-top: 1.5rem; margin-bottom: 3rem;">
            <p>Loading users...</p>
        </div>

        <!-- System Bookings Section -->
        <h2>All System Bookings</h2>
        <div id="allBookings" style="margin-top: 1.5rem;">
            <p>Loading bookings...</p>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <script>
        // Global Toast Notification Function
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type} show`;
            toast.textContent = message;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function loadAdminData() {
            const statsRes = await fetch('/api/admin/stats');
            if (statsRes.status === 401 || statsRes.status === 403) {
                alert('Admin access required.');
                window.location.href = '/login.html';
                return;
            }
            const stats = await statsRes.json();
            document.getElementById('customerCount').textContent = stats.customer_count;
            document.getElementById('workerCount').textContent = stats.worker_count;
            document.getElementById('bookingCount').textContent = stats.booking_count;

            loadUsers();
            loadBookings();
        }

        async function loadUsers() {
            try {
                const res = await fetch('/api/admin/users');
                const users = await res.json();
                const container = document.getElementById('allUsers');

                if (users.length === 0) {
                    container.innerHTML = `<p style="color: #64748b;">No users found.</p>`;
                    return;
                }

                container.innerHTML = `
                    <div style="display: flex; flex-direction: column; gap: 1rem;">
                      ${users.map(u => `
                        <div style="background: white; border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; display: flex; justify-content: space-between; align-items: center;">
                          <div>
                            <strong>${u.name}</strong> <span style="font-size: 0.85rem; color: #64748b;">(${u.email})</span>
                            <p style="color: #0d9488; font-size: 0.85rem; margin-top: 0.25rem; font-weight: 600; text-transform: uppercase;">Role: ${u.role}</p>
                          </div>
                          ${u.role !== 'admin' ? `<button class="btn" style="background: var(--danger); padding: 0.5rem 1rem;" onclick="deleteUser(${u.id})">Delete</button>` : '<span style="color: #64748b; font-size: 0.85rem;">Admin Account</span>'}
                        </div>
                      `).join('')}
                    </div>
                `;
            } catch (err) {
                console.error('Error loading users:', err);
            }
        }

        async function loadBookings() {
            try {
                const bookingsRes = await fetch('/api/admin/bookings');
                const bookings = await bookingsRes.json();
                const container = document.getElementById('allBookings');

                if (bookings.length === 0) {
                    container.innerHTML = `<p style="color: #64748b;">No bookings made yet.</p>`;
                    return;
                }

                container.innerHTML = `
                    <div style="display: flex; flex-direction: column; gap: 1rem;">
                      ${bookings.map(b => `
                        <div style="background: white; border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; display: flex; justify-content: space-between; align-items: center;">
                          <div>
                            <strong>Customer: ${b.customer_name}</strong> &rarr; <strong>Worker: ${b.worker_name}</strong>
                            <p style="color: #64748b; font-size: 0.85rem; margin-top: 0.25rem;">📅 ${b.service_date} at ${b.service_time} | 📍 ${b.address}</p>
                            <p style="font-size: 0.9rem; margin-top: 0.25rem;"><strong>Work:</strong> ${b.work_description}</p>
                          </div>
                          <span style="background: #ccfbf1; color: #0f766e; padding: 0.3rem 0.7rem; border-radius: 9999px; font-weight: 600; font-size: 0.85rem;">${b.status}</span>
                        </div>
                      `).join('')}
                    </div>
                `;
            } catch (err) {
                console.error('Error loading bookings:', err);
            }
        }

        async function deleteUser(userId) {
            if (!confirm('Kya aap sach me is user/worker ko delete karna chahte hain?')) {
                return;
            }

            try {
                const res = await fetch(`/api/admin/users/${userId}`, {
                    method: 'DELETE'
                });

                const data = await res.json();

                if (res.ok) {
                    showToast('User successfully deleted!');
                    loadUsers(); // List ko refresh karega taaki dashboard update ho jaye
                } else {
                    alert(data.error || 'Failed to delete user');
                }
            } catch (err) {
                console.error('Delete error:', err);
                alert('Server error while deleting user');
            }
        }

        async function logout() {
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = '/login.html';
        }

        loadAdminData();
    </script>
</body>

</html>
