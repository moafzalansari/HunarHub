<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Customer Dashboard — Hunar Hub</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <navbar>
        <a href="/" class="logo">Hunar Hub (Customer)</a>
        <ul class="nav-links">
            <li><a href="/">Browse Services</a></li>
            <li><a href="#" onclick="logout()">Logout</a></li>
        </ul>
    </navbar>

    <div class="container">
        <h2>My Service Bookings</h2>
        <div id="bookingsList" style="margin-top: 1.5rem;">
            <p>Loading bookings...</p>
        </div>
    </div>

    <script>
        async function loadBookings() {
            const res = await fetch('/api/bookings/customer');
            if (res.status === 401) {
                window.location.href = '/login.html';
                return;
            }
            const bookings = await res.json();
            const container = document.getElementById('bookingsList');

            if (bookings.length === 0) {
                container.innerHTML = `<p style="color: #64748b;">No service bookings yet. <a href="/">Book a professional</a></p>`;
                return;
            }

            container.innerHTML = `
        <div style="display: flex; flex-direction: column; gap: 1rem;">
          ${bookings.map(b => `
            <div style="background: white; border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; display: flex; justify-content: space-between; align-items: center;">
              <div>
                <h3>${b.category_name} &bull; <span style="font-weight: normal; color: #0d9488;">${b.worker_name}</span></h3>
                <p style="color: #64748b; font-size: 0.9rem; margin-top: 0.25rem;">📅 Date: ${b.service_date} at ${b.service_time} | 📍 ${b.address}</p>
                <p style="color: #334155; font-size: 0.9rem; margin-top: 0.5rem;"><strong>Work:</strong> ${b.work_description}</p>
                <p style="margin-top: 0.5rem; font-weight: 600;">Status: <span style="color: #0f766e;">${b.status}</span></p>
              </div>
              <div style="display: flex; flex-direction: column; gap: 0.5rem; align-items: flex-end;">
                <span style="font-size: 1.1rem; font-weight: bold;">₹${b.price}</span>
                ${b.status === 'Completed' ? `
                  <button class="btn" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;" onclick="openReviewModal(${b.id})">Leave Review</button>
                ` : ''}
                ${b.status === 'Pending' ? `
                  <button class="btn" style="background: #ef4444; padding: 0.4rem 0.8rem; font-size: 0.85rem;" onclick="updateStatus(${b.id}, 'Cancelled')">Cancel</button>
                ` : ''}
              </div>
            </div>
          `).join('')}
        </div>
      `;
        }

        async function updateStatus(id, status) {
            const res = await fetch(`/api/bookings/${id}/status`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status })
            });
            if (res.ok) loadBookings();
        }

        function openReviewModal(bookingId) {
            const rating = prompt('Enter rating (1 to 5):');
            const comment = prompt('Enter review comment:');
            if (rating && comment) {
                fetch(`/api/bookings/${bookingId}/review`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rating: parseInt(rating), comment })
                }).then(res => res.json()).then(data => {
                    alert(data.message || data.error);
                    loadBookings();
                });
            }
        }

        async function logout() {
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = '/login.html';
        }

        loadBookings();
    </script>
</body>

</html>
