<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Register — Hunar Hub</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <navbar>
        <a href="/" class="logo">Hunar Hub</a>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/login.html">Login</a></li>
        </ul>
    </navbar>

    <div class="container">
        <div class="form-card">
            <h2 style="margin-bottom: 1.5rem; text-align: center;">Create Account</h2>
            <div id="errorMsg" style="color: red; margin-bottom: 1rem; text-align: center; display: none;"></div>
            <div id="successMsg" style="color: green; margin-bottom: 1rem; text-align: center; display: none;"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="********">
                </div>
                <div class="form-group">
                    <label>I want to:</label>
                    <select id="role" required>
                        <option value="customer">Hire Services (Customer)</option>
                        <option value="worker">Provide Services (Skilled Worker)</option>
                    </select>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Register</button>
            </form>
            <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
                Already have an account? <a href="/login.html" style="color: var(--primary);">Login here</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const body = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                role: document.getElementById('role').value
            };
            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json();
            if (res.ok) {
                document.getElementById('successMsg').style.display = 'block';
                document.getElementById('successMsg').textContent = data.message;
                setTimeout(() => window.location.href = '/login.html', 1500);
            } else {
                document.getElementById('errorMsg').style.display = 'block';
                document.getElementById('errorMsg').textContent = data.error;
            }
        });
    </script>
</body>

</html>
